name: Publish to npm

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack the tested package
        run: |
          mkdir "$RUNNER_TEMP/npm-package"
          npm pkg set "gitHead=$GITHUB_SHA"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
          mv "$RUNNER_TEMP"/npm-package/*.tgz "$RUNNER_TEMP/release.tgz"
          tar -xzf "$RUNNER_TEMP/release.tgz" -C "$RUNNER_TEMP/npm-package"
          cd "$RUNNER_TEMP/npm-package/package"
          node -e '
            const pkg = require("./package.json")
            if (pkg.gitHead !== process.env.GITHUB_SHA) process.exit(1)
            require("node:fs").accessSync(pkg.dsh.bundle.patch)
          '
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: ${{ runner.temp }}/release.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the release tag
        run: |
          tar -xOf release.tgz package/package.json > package.json
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Publish the tagged package
        run: |
          registry=https://registry.npmjs.org
          spec=$(node -p 'const pkg = require("./package.json"); pkg.name + "@" + pkg.version')
          if existing=$(npm view "$spec" gitHead --json --registry "$registry" 2>"$RUNNER_TEMP/npm-view.err"); then
            if printf '%s' "$existing" | node -e '
              const value = JSON.parse(require("node:fs").readFileSync(0, "utf8") || "null")
              const head = Array.isArray(value) && value.length === 1 ? value[0] : value
              process.exit(head === process.env.GITHUB_SHA ? 0 : 1)
            '; then
              echo "Published $spec already points to this commit."
              exit 0
            fi
            echo "::error::$spec already exists with a different or missing gitHead."
            exit 1
          fi
          if ! grep -Fq E404 "$RUNNER_TEMP/npm-view.err"; then
            cat "$RUNNER_TEMP/npm-view.err" >&2
            exit 1
          fi
          npm publish release.tgz --access public --registry "$registry"
